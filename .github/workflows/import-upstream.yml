name: Import original PCSX2 Git history

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Require a token that can write workflow files
        env:
          IMPORT_TOKEN: ${{ secrets.UPSTREAM_IMPORT_PAT }}
        run: |
          if [ -z "$IMPORT_TOKEN" ]; then
            echo "::error::Set the UPSTREAM_IMPORT_PAT Actions secret with Contents: read/write and Workflows: read/write permissions for this repository."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.UPSTREAM_IMPORT_PAT }}
          persist-credentials: true

      - name: Import upstream and create developer branch
        run: bash scripts/import-upstream-history.sh
