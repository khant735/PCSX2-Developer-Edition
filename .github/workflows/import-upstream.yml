name: Import original PCSX2 Git history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Import upstream and create developer branch
        run: bash scripts/import-upstream-history.sh
